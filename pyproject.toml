[project]
name = "onmyoji-auto-script"
version = "0.1.0"
description = "Onmyoji Auto Script - Automated game tasks for Onmyoji"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "numpy==1.26.4",
    "opencv-python-headless==4.9.0.80",
    "adbutils==0.11.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "wrapt==1.15.0",
    "psutil==6.1.1",
    "ppocr-onnx @ git+https://github.com/CronusLM/ppocr-onnx@master",
    "cn2an==0.5.23",
    "paho-mqtt==1.6.1",
    "fastapi==0.104.1",
    "uvicorn==0.38.0",
    "websockets==13.1",
    "zerorpc==0.6.3",
    "pydantic==2.10.0",
    "rich==13.3.5",
    "pyyaml==6.0.1",
    "tqdm==4.65.0",
    "anytree==2.8.0",
    "cryptography>=42.0.7",
    "onepush==1.3.0",
    "inflection==0.5.1",
    "frida==17.6.2",
    "frida-tools==14.5.2",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools<80", "wheel", "packaging>=24.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = []
override-dependencies = [
    "opencv-python-headless==4.9.0.80",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tasks*", "module*", "deploy*", "tests*", "dev_tools*"]
exclude = []